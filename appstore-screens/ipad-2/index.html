<!DOCTYPE html>
<html lang="en">
<head>

  <title>iPad 2 — AI Personas</title>

  <style>
    body { background: #FBF8F1; display: flex; justify-content: center; padding: 40px; }

      </div>
    </div>
  </div>

</html>
